<svg xmlns="http://www.w3.org/2000/svg" width="948" height="308" viewBox="-24 -24 948 308" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="roomTitle roomDesc">
<title id="roomTitle">Pixel Studio room</title>
<desc id="roomDesc">Stanza pixel art a tema github-dark: finestra notturna con luna e nuvola in movimento, scrivania con monitor CRT il cui contribution graph si riempie a blocchi, tazza con vapore, pianta che oscilla, gatto che dorme con z animate e poster FJ.</desc>
<defs>
<clipPath id="sky"><rect x="80" y="48" width="152" height="112"/></clipPath>
<clipPath id="room"><rect x="0" y="0" width="900" height="260"/></clipPath>
<radialGradient id="gBlue"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/><stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
<radialGradient id="gPurple"><stop offset="0" stop-color="#bb9af7" stop-opacity="0.20"/><stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
<radialGradient id="gGold"><stop offset="0" stop-color="#e0af68" stop-opacity="0.26"/><stop offset="100%" stop-color="#e0af68" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[text{font-family:ui-monospace,'Courier New',monospace;shape-rendering:auto}
@keyframes drift{0%{transform:translateX(-56px)}100%{transform:translateX(152px)}}
@keyframes breathe{0%,100%{opacity:.28}50%{opacity:.72}}
@keyframes twinkle{0%,100%{opacity:.18}45%{opacity:1}}
@keyframes wave{0%{opacity:0}5%{opacity:1}86%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}25%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes swish{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,4px)}20%{opacity:.9}100%{opacity:0;transform:translate(6px,-16px)}}
@keyframes glow{0%,100%{opacity:.70}50%{opacity:1}}
@keyframes led{0%,70%{opacity:1}71%,100%{opacity:.18}}
@keyframes caret{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes twitch{0%,88%,100%{transform:rotate(0deg)}92%{transform:rotate(-8deg)}96%{transform:rotate(4deg)}}
.cloud{animation:drift 34s linear infinite}
.aura{animation:breathe 8s ease-in-out infinite}
.aura-b{animation:breathe 8s ease-in-out infinite;animation-delay:2.4s}
.star{animation:twinkle 4s ease-in-out infinite}
.star.s2{animation-duration:5.6s;animation-delay:1.1s}
.star.s3{animation-duration:6.8s;animation-delay:2.3s}
.cell{opacity:0;animation:wave 9s linear infinite}
.d0{animation-delay:0s}.d1{animation-delay:.18s}.d2{animation-delay:.36s}.d3{animation-delay:.54s}
.d4{animation-delay:.72s}.d5{animation-delay:.9s}.d6{animation-delay:1.08s}.d7{animation-delay:1.26s}
.d8{animation-delay:1.44s}.d9{animation-delay:1.62s}
.steam{opacity:0;animation:steam 4.2s ease-out infinite}
.steam.s2{animation-delay:1.4s}
.steam.s3{animation-delay:2.8s}
.leaves{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:swish 3.6s ease-in-out infinite}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 6s ease-in-out infinite}
.z{opacity:0;animation:zfloat 3.4s ease-out infinite}
.z.z2{animation-delay:1.7s}
.fj{animation:glow 5s ease-in-out infinite}
.led{animation:led 2.6s steps(1,end) infinite}
.caret{animation:caret 1.1s steps(1,end) infinite}
/* reduced motion: stato finale statico, il contenuto resta visibile */
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cell{opacity:1}.steam{opacity:.85}.z{opacity:.9}}]]></style>
